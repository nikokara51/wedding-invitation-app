apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-invite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wedding-invite
  template:
    metadata:
      labels:
        app: wedding-invite
    spec:
      containers:
      - name: app
        image: YOUR_DOCKER_REPO/wedding-invite:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: wedding-secrets
              key: database_url
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: wedding-secrets
              key: google_maps
        - name: BASE_URL
          value: https://yourdomain.com
