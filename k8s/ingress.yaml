apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wedding-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wedding-invite
            port:
              number: 80
